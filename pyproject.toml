[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-derm"
version = "0.1.0"
description = "Reproducible 25-condition case-level teledermatology experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vatsal Patel"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "iterative-stratification>=0.1.9",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "Pillow>=10",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.45",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
derm-foundation = ["tensorflow>=2.15"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
