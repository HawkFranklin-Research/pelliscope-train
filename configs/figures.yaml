  uncertainty_alpha: 0.15
  mean_linewidth: 2.5
  train: "#611F53"
  validation: "#CB1B4F"
  test: "#F58860"
  roc_micro: "#3F1B43"
  roc_macro: "#841E5A"
  pr_micro: "#2CA02C"
  pr_macro: "#D62728"
  sensitivity: "#1B9E77"
  specificity: "#D95F02"
  threshold_band_alpha: 0.20
  threshold_default: "#8856A7"
  threshold_default_text: "#5E3C99"
  threshold_balanced: "#238B45"
  threshold_balanced_text: "#006D2C"
  operating_curve: "#9ECAE1"
  youden_curve: "#2CA02C"
  youden_point: "#D62728"
