  image_count: "#4C78A8"
  shot_close_up: "#8DD3C7"
  shot_angle: "#FFFFB3"
  shot_distance: "#BEBADA"
  baseline_panel: "#FBE4EC"
  mil_panel: "#E8E5FA"
